  <body>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (!window.swetrix) return;
        try {
          window.swetrix.init("SHQpMQlC6hpN", {
            apiURL: "https://blogs-swetrix-frontend.rwezkp.easypanel.host/backend/v1/log",
          });
          window.swetrix.trackViews({ search: ["vista"] });
          window.__atlasSwetrixReady = true;
          window.dispatchEvent(new Event("atlas-swetrix-ready"));
        } catch (error) {
          console.warn("Swetrix could not be initialized", error);
        }
      }, { once: true });
    </script>
    <noscript>
      <img
        src="https://blogs-swetrix-frontend.rwezkp.easypanel.host/backend/log/noscript?pid=SHQpMQlC6hpN"
